[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satsentinel-cli"
version = "0.1.9"
description = "Factory provisioning CLI for SatSentinel ESP32-S3 units"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "click>=8.1",
    "questionary>=2.0",
    "rich>=13.0",
    "requests>=2.31",
    "pyserial>=3.5",
    "esptool>=4.7",
]

[project.scripts]
satsentinel-cli = "satsentinel_flash.main:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "responses>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["satsentinel_flash"]
include = ["satsentinel-cli.cfg"]
